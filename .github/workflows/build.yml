name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Localizar projeto e compilar APK com Display Virtual
        run: |
          PROJECT_ROOT=$(dirname $(find . -name "settings.gradle*" -o -name "build.gradle.kts" | head -n 1))
          
          if [ -n "$PROJECT_ROOT" ] && [ -d "$PROJECT_ROOT" ]; then
            echo "Entrando na pasta do projeto: $PROJECT_ROOT"
            cd "$PROJECT_ROOT"
          fi

          # Executa dentro do xvfb para fornecer um ambiente gráfico virtual ao AWT do KSP
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            xvfb-run --auto-servernum ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew não encontrado. Compilando com Gradle 9.3.1..."
            xvfb-run --auto-servernum gradle assembleDebug --stacktrace
          fi

      - name: Salvar o arquivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Solarium-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
