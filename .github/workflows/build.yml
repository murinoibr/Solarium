name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Localizar projeto e compilar APK
        run: |
          # Localiza a pasta onde está o build.gradle.kts ou settings.gradle
          PROJECT_ROOT=$(dirname $(find . -name "settings.gradle*" -o -name "build.gradle.kts" | head -n 1))
          
          if [ -n "$PROJECT_ROOT" ] && [ -d "$PROJECT_ROOT" ]; then
            echo "Entrando na pasta do projeto: $PROJECT_ROOT"
            cd "$PROJECT_ROOT"
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew não encontrado. Compilando com Gradle 9.3.1..."
            gradle assembleDebug --stacktrace
          fi

      - name: Salvar o arquivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Solarium-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
