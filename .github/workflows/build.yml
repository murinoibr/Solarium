name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes do Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-cleanup: always

      - name: Enviar dependências ao GitHub
        uses: gradle/actions/dependency-submission@v6

      - name: Gerar chave de assinatura de teste (debug.keystore)
        run: |
          # Gera a chave padrão de debug do Android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Copia também para dentro da pasta app/ por precaução
          cp debug.keystore app/ 2>/dev/null || true

      - name: Localizar projeto e compilar APK
        run: |
          PROJECT_ROOT=$(dirname $(find . -name "settings.gradle*" -o -name "build.gradle.kts" | head -n 1))
          
          if [ -n "$PROJECT_ROOT" ] && [ -d "$PROJECT_ROOT" ]; then
            echo "Entrando na pasta do projeto: $PROJECT_ROOT"
            cd "$PROJECT_ROOT"
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew não encontrado. Compilando com Gradle 9.3.1..."
            gradle assembleDebug --stacktrace
          fi

      - name: Salvar o arquivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Solarium-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
